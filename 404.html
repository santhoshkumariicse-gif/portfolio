<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Santhosh Kumar M — Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; URL='/portfolio/'" />
  <script>
    // GitHub Pages SPA Single-Page redirect script
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body style="background:#0A0B09;color:#F0F0E9;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Redirecting to <a href="/portfolio/" style="color:#C7FF45;">Santhosh Kumar M Portfolio</a>...</p>
</body>
</html>
